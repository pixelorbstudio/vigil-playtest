<body>
<!-- a lost night's reboot, on any shift: black from the first paint, the blink (app.js, the night's end); otherwise the
     title, black from the first paint until the desk, the monitor, the keyboard and the mug are drawn (app.js, the title;
     ?notitle leaves it out, for the audits and stills pages) -->
<script>try { if (localStorage.getItem('vigil.blink')) document.body.classList.add('blink'); else if (!/[?&]notitle(&|$)/.test(location.search)) document.body.classList.add('title'); } catch (e) { document.body.classList.add('title'); }</script>
<div id="stage">
  <div id="night-over" hidden>
    <p id="no-yet" hidden></p>
    <p id="no-what"></p>
    <p id="no-choices"><button id="no-reboot" type="button">reboot</button><button id="no-report" type="button">shift report</button></p>
    <pre id="no-report-text" hidden></pre>
  </div>
  <div id="look">
    <div id="scene-holder"></div>
    <div id="terminal" aria-live="polite">
      <div id="term-tube"><canvas id="term-canvas"></canvas></div>
      <pre id="term-out" class="sr-only"></pre>
    </div>
    <svg id="overlay" viewBox="0 0 1440 1080" width="1440" height="1080" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="screen-clip"></clipPath>
        <linearGradient id="glare-band-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5"  stop-color="#fff" stop-opacity="1"/>
          <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="glare-corner-grad">
          <stop offset="0"  stop-color="#fff" stop-opacity="1"/>
          <stop offset="1"  stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
      </defs>
      <!-- glare: a soft corner bloom plus two diagonal bands, clipped to the tube face -->
      <g id="glass" clip-path="url(#screen-clip)"><g id="glare-move">
        <ellipse class="glare" cx="410" cy="190" rx="300" ry="200" fill="url(#glare-corner-grad)" filter="url(#softer)" opacity=".13"/>
        <rect class="glare" x="430" y="-60" width="150" height="820" fill="url(#glare-band-grad)" filter="url(#soft)" opacity=".05" transform="rotate(35 505 350)"/>
        <rect class="glare" x="590" y="-60" width="46" height="820" fill="url(#glare-band-grad)" filter="url(#soft)" opacity=".09" transform="rotate(35 613 350)"/>
      </g></g>
      <g id="mug3d"></g>
      <g id="steam-rig"><g id="steam" transform="translate(1296 756)">
        <path class="wisp" style="--dx:-14px;--delay:0s"   d="M0 0c-8-18 8-34 0-52s6-34-2-52" />
        <path class="wisp" style="--dx:2px;--delay:1.1s"   d="M0 0c6-16-8-32 0-50s-6-36 2-54" />
        <path class="wisp" style="--dx:16px;--delay:2.2s"  d="M0 0c-6-20 6-30 0-48s8-38 0-56" />
      </g></g>
    </svg>
  </div>
</div>

<!-- for playtesters (?playtest): what this build is (Arnold, 2026-10-06; the story audit: night 3 repeats forever), top
     left, clear of the hint at every width; the log is saved from the Esc menu (the hum, the key sounds and the log were
     buttons here until the cold playtest's dry run, 2026-10-11: they are the menu's now) -->
<p id="build-note" hidden>playtest build: night 1 is the game. nights 2 and 3 are unfinished, and night 3 repeats. esc to save your log.</p>
<div id="hud">
  <span id="hint">start typing · try the knobs · sip the coffee</span>
</div>
